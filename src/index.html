async function call(path,opt={}){
 const h={'content-type':'application/json'};if(token)h.authorization='Bearer '+token;

function start(u){

function pick(k){

 const q=G.qs[G.i],left=Math.max(0,LIM-(performance.now()-G.t0)),bs=M.querySelectorAll('.opts button'),ci=q.opts.indexOf(q.a);

   try{await call('/api/comments',{method:'POST',body:{text:v,unit:+$('cu').value}});t.value='';await pull()}catch(x){$('ce').textContent=x.message}
   const b=$('cs');if(b)b.disabled=false}}
 M.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{
  if(b.dataset.c!=='1'){b.dataset.c='1';b.textContent='한 번 더 누르면 삭제';return}
  try{await call('/api/comments/'+b.dataset.d,{method:'DELETE'});await pull()}catch(x){}});
}
async function pull(){
 if(document.hidden||G)return;
 try{
  if(tab==='rank'){const d=await call('/api/rank?unit='+rankU);const s=JSON.stringify(d.rows);if(s!==JSON.stringify(rankRows)){rankRows=d.rows;if(tab==='rank'&&!G)rank()}}
  if(tab==='talk'){const d=await call('/api/comments');const s=JSON.stringify(d.rows);if(s!==JSON.stringify(comments)){comments=d.rows;const a=document.activeElement;if(tab==='talk'&&!G&&!(a&&(a.id==='ct'||a.id==='cu')))talk()}}
 }catch(e){}
}
document.querySelectorAll('#tab button').forEach(b=>b.onclick=()=>{if(G){clearTimeout(G.timer);G=null}tab=b.dataset.v;editing=false;render();pull()});
document.addEventListener('visibilitychange',pull);
setInterval(pull,POLL);
(async()=>{
 if(token){M.innerHTML='<div class="c">로그인 정보 확인 중…</div>';try{ME=await call('/api/me')}catch(e){}}
 render();
})();
